name: Deploy Study AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/deploy-study-ai.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Worker with GitHub-hosted Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Add GEMINI_API_KEY, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then re-run this workflow."
            exit 0
          fi
          npm install --no-save wrangler@^4
          SECRET_FILE="$RUNNER_TEMP/study-ai-worker-secrets.json"
          trap 'rm -f "$SECRET_FILE"' EXIT
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/study-ai-worker-secrets.json",JSON.stringify({GEMINI_API_KEY:process.env.GEMINI_API_KEY}),{mode:0o600})'
          npx wrangler deploy --config ai-worker/wrangler.toml --secrets-file "$SECRET_FILE"
